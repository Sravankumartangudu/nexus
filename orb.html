<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; cursor: default;
               -webkit-user-select: none; user-select: none; }
  canvas { display: block; margin: 0 auto; width: 220px; height: 220px; }
  #cap { font: 500 12px -apple-system, sans-serif; color: #d8f6ff; text-align: center;
         margin: 2px 12px 0; max-height: 48px; overflow: hidden; opacity: 0;
         display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
         text-shadow: 0 0 6px rgba(0,150,255,.9), 0 1px 2px #000; transition: opacity .4s; }
</style></head>
<body>
<canvas id="c" width="440" height="440"></canvas>
<div id="cap"></div>
<script>
// Nexus orb — the floating face of the fleet's voice control. Ported from Jarvis's orb;
// states map to Nexus's voice modes. Swift drives it via setState / setStyle / setLevel / setCaption.
const g = document.getElementById('c').getContext('2d');
const cap = document.getElementById('cap');
const C = 220;   // canvas centre
const COLORS = {
  idle: [79, 209, 255], listening: [140, 235, 255], working: [255, 186, 84],
  speaking: [120, 230, 255], off: [110, 120, 130], error: [255, 90, 90],
};
let state = 'idle', style = 'reactor', level = 0, energy = 0, col = COLORS.idle.slice();
// Live fleet counts, mirrored from the dashboard: one satellite per agent in the `fleet` style,
// lit for active (running) agents and dimmed for the rest.
let fleetData = { total: 7, running: 0 };
const t0 = performance.now();

// Called from Swift.
function setState(s) { state = s; }
function setStyle(s) { if (STYLES[s]) style = s; }
function setLevel(l) { level = Math.min(1, l * 14); }
function setCaption(t) { cap.textContent = t; cap.style.opacity = t ? 1 : 0; }
function setFleet(total, running) {
  fleetData = { total: Math.max(0, total | 0), running: Math.max(0, running | 0) };
}

const rgba = a => `rgba(${col[0] | 0},${col[1] | 0},${col[2] | 0},${a})`;

function glow(r, a) {
  const grd = g.createRadialGradient(C, C, 0, C, C, r);
  grd.addColorStop(0, rgba(a)); grd.addColorStop(1, rgba(0));
  g.fillStyle = grd; g.beginPath(); g.arc(C, C, r, 0, 7); g.fill();
}

function core(r) {
  const grd = g.createRadialGradient(C, C, 0, C, C, r);
  grd.addColorStop(0, 'rgba(255,255,255,0.95)');
  grd.addColorStop(0.35, rgba(0.9));
  grd.addColorStop(1, rgba(0));
  g.fillStyle = grd; g.beginPath(); g.arc(C, C, r, 0, 7); g.fill();
}

function circle(r, width, alpha) {
  g.lineWidth = width; g.strokeStyle = rgba(alpha);
  g.beginPath(); g.arc(C, C, r, 0, 7); g.stroke();
}

function segments(r, count, width, rot, gap, alpha) {
  g.strokeStyle = rgba(alpha); g.lineWidth = width;
  const seg = Math.PI * 2 / count;
  for (let i = 0; i < count; i++) {
    const a = rot + i * seg;
    g.beginPath(); g.arc(C, C, r, a, a + seg * (1 - gap)); g.stroke();
  }
}

// Each style draws one frame from time t, smoothed energy e (0–1) and spin speed.
const STYLES = {
  // Iron Man arc reactor: rotating segmented rings around a white-hot core.
  reactor(t, e, spin) {
    glow(215, 0.35 * e);
    circle(192, 2, 0.35);
    circle(96, 2, 0.35);
    segments(172, 6, 10, t * spin * 0.5, 0.2, 0.5 + 0.4 * e);
    segments(142, 3, 22, -t * spin * 0.8, 0.5, 0.35 + 0.5 * e);
    segments(114, 12, 4, t * spin * 1.3, 0.25, 0.55 + 0.4 * e);
    core(48 + 34 * e);
  },

  // Soft, organic blob with ripples spreading outward, like Siri.
  pulse(t, e, spin) {
    glow(215, 0.3 * e);
    for (let k = 0; k < 3; k++) {
      const p = ((t * (0.25 + spin * 0.15) + k / 3) % 1);
      circle(70 + p * 140, 3, (1 - p) * 0.5 * (0.4 + e));
    }
    for (let layer = 0; layer < 3; layer++) {
      const R = (62 + 46 * e) * (1 - layer * 0.18);
      g.beginPath();
      for (let i = 0; i <= 96; i++) {
        const a = i / 96 * Math.PI * 2;
        const wob = 1 + (0.05 + 0.1 * e) * Math.sin(3 * a + t * (1.6 + layer)) * Math.sin(2 * a - t * 1.1 + layer);
        const x = C + Math.cos(a) * R * wob, y = C + Math.sin(a) * R * wob;
        i ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.fillStyle = rgba(0.22 + layer * 0.12);
      g.fill();
    }
    core(40 + 30 * e);
  },

  // Circular audio equaliser: bars around a ring that jump with your voice.
  waveform(t, e, spin) {
    glow(200, 0.25 * e);
    const n = 72, base = 96;
    g.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2 + t * spin * 0.15;
      const wave = 0.5 + 0.5 * Math.sin(i * 0.9 + t * 5) * Math.sin(i * 0.37 - t * 3.1);
      const len = 8 + (20 + 90 * e) * wave * (state === 'idle' || state === 'off' ? 0.3 : 1);
      g.strokeStyle = rgba(0.45 + 0.5 * wave);
      g.lineWidth = 5;
      g.beginPath();
      g.moveTo(C + Math.cos(a) * base, C + Math.sin(a) * base);
      g.lineTo(C + Math.cos(a) * (base + len), C + Math.sin(a) * (base + len));
      g.stroke();
    }
    circle(base - 10, 2, 0.5);
    core(44 + 30 * e);
  },

  // A swirling 3D sphere of particles that expands as Nexus talks.
  particles(t, e, spin) {
    glow(210, 0.25 * e);
    const n = 220, R = 110 + 50 * e, rot = t * spin * 0.6;
    for (let i = 0; i < n; i++) {
      // Even spread on a sphere (golden-angle spiral).
      const y = 1 - (i + 0.5) / n * 2, r = Math.sqrt(1 - y * y), phi = i * 2.39996 + rot;
      const jitter = 1 + 0.08 * e * Math.sin(t * 4 + i);
      const x = Math.cos(phi) * r * jitter, z = Math.sin(phi) * r * jitter;
      const depth = (z + 1) / 2;
      g.fillStyle = rgba(0.15 + 0.75 * depth);
      g.beginPath();
      g.arc(C + x * R, C + y * R * jitter, 1.5 + 3 * depth, 0, 7);
      g.fill();
    }
    core(34 + 26 * e);
  },

  // Three gimbal rings tumbling in 3D around the core.
  gyroscope(t, e, spin) {
    glow(210, 0.3 * e);
    const R = 150 + 25 * e;
    for (let k = 0; k < 3; k++) {
      const tilt = k * Math.PI / 3 + t * spin * 0.2;
      const squash = Math.abs(Math.cos(t * spin * (0.5 + k * 0.25) + k));
      g.lineWidth = 6 - k;
      g.strokeStyle = rgba(0.4 + 0.5 * e);
      g.beginPath();
      g.ellipse(C, C, R - k * 18, Math.max(4, (R - k * 18) * squash), tilt, 0, Math.PI * 2);
      g.stroke();
    }
    circle(70, 2, 0.4);
    core(50 + 30 * e);
  },

  // Orbiting fleet: one satellite per agent, echoing the dashboard's command centre.
  // The first `fleetData.running` satellites are lit (active); the rest are dimmed (not active).
  fleet(t, e, spin) {
    glow(210, 0.3 * e);
    circle(150, 1.5, 0.25);
    circle(100, 1.5, 0.2);
    const n = Math.max(1, fleetData.total);
    for (let i = 0; i < n; i++) {
      const a = t * spin * 0.5 + i / n * Math.PI * 2;
      const R = 100 + (i % 2) * 50;
      const x = C + Math.cos(a) * R, y = C + Math.sin(a) * R * 0.5;
      const active = i < fleetData.running;
      // beam back to the core — bright for active agents, a faint grey tether for idle ones
      g.strokeStyle = active ? rgba(0.15 + 0.35 * e) : `rgba(120,132,146,${0.08 + 0.05 * e})`;
      g.lineWidth = active ? 1.4 : 1;
      g.beginPath(); g.moveTo(C, C); g.lineTo(x, y); g.stroke();
      // the satellite
      const r = (active ? 5 : 3.5) + (active ? 3 : 1) * e;
      g.fillStyle = active ? rgba(0.65 + 0.35 * e) : 'rgba(122,134,148,0.55)';
      g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
      if (active) {   // halo ring on live agents
        g.strokeStyle = rgba(0.3 * e); g.lineWidth = 1;
        g.beginPath(); g.arc(x, y, r + 3, 0, 7); g.stroke();
      }
    }
    core(40 + 28 * e);
    // Live count in the core, matching the dashboard's running / total.
    g.fillStyle = 'rgba(8,12,22,0.9)';
    g.font = '700 30px -apple-system, system-ui, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(`${fleetData.running}/${n}`, C, C);
  },
};

function frame(now) {
  const t = (now - t0) / 1000;
  const target = COLORS[state] || COLORS.idle;
  for (let i = 0; i < 3; i++) col[i] += (target[i] - col[i]) * 0.08;

  const want = {
    idle: 0.25 + 0.08 * Math.sin(t * 1.5),
    listening: 0.55 + 0.45 * level,
    working: 0.6 + 0.15 * Math.sin(t * 6),
    speaking: 0.55 + 0.4 * Math.abs(Math.sin(t * 7) * Math.sin(t * 2.3)),
    error: 0.5,
    off: 0.06,
  }[state] ?? 0.12;
  energy += (want - energy) * 0.2;
  const spin = { working: 2.6, idle: 0.3, off: 0.1 }[state] ?? 0.8;

  g.clearRect(0, 0, 440, 440);
  g.lineCap = 'round';
  STYLES[style](t, energy, spin);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body></html>
